<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Landscrawl</title>
  <meta name="description" content="Type a sentence and a hand-drawn landscape is drawn live in your browser. No accounts, no servers, no AI.">
  <meta name="color-scheme" content="dark">
  <!--csp-->
  <link rel="stylesheet" href="/src/ui/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23f6efe1'/%3E%3Ccircle cx='22' cy='11' r='3' fill='%23e8c15a'/%3E%3Cpath d='M3 24 L12 12 L17 19 L21 15 L29 24 Q16 29 3 24Z' fill='%231b1b1f'/%3E%3C/svg%3E">
</head>
<body>
  <svg id="lines" aria-hidden="true" preserveAspectRatio="none"></svg>
  <header>
    <a class="wordmark" href="#hero">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="15" fill="#f6efe1"/><circle cx="22" cy="11" r="3" fill="#e8c15a"/><path d="M3 24 L12 12 L17 19 L21 15 L29 24 Q16 29 3 24Z" fill="#1b1b1f"/></svg>
      <span id="wordmark">Landscrawl</span>
    </a>
    <nav class="tools" aria-label="Language">
      <button class="lang" type="button" aria-pressed="true" tabindex="-1">EN</button>
    </nav>
  </header>
  <main>
    <div id="hero">
      <div class="intro">
        <h1><span class="kicker" id="kicker"></span> <span id="headline"></span></h1>
        <p class="lede" id="lede"></p>
      </div>
      <div class="drawing"><div id="stage"></div></div>
      <div class="composer">
        <textarea id="text" rows="2" spellcheck="false" autocomplete="off" aria-label="Describe your landscape"></textarea>
        <p id="status" aria-live="polite"></p>
        <div class="actions">
          <button class="button primary" id="btn-png" type="button"></button>
          <button class="button" id="btn-svg" type="button"></button>
          <button class="button" id="btn-copy" type="button"></button>
          <button class="button" id="btn-surprise" type="button"></button>
          <button class="button" id="btn-reroll" type="button"></button>
        </div>
        <fieldset class="ratios" aria-labelledby="legend-ratio">
          <legend class="label-small" id="legend-ratio"></legend>
          <label><input type="radio" name="ratio" value="16:9"><span>16:9</span></label>
          <label><input type="radio" name="ratio" value="4:3"><span>4:3</span></label>
          <label><input type="radio" name="ratio" value="1:1"><span>1:1</span></label>
          <label><input type="radio" name="ratio" value="9:16"><span>9:16</span></label>
        </fieldset>
        <p class="label-small" id="chips-title"></p>
        <ul id="chips" class="chips"></ul>
        <noscript><p>Landscrawl draws in your browser, so it needs JavaScript. Nothing is sent anywhere.</p></noscript>
      </div>
    </div>

    <section aria-labelledby="examples-title">
      <h2 id="examples-title"></h2>
      <p id="examples-note"></p>
      <ul id="examples"></ul>
    </section>

    <section aria-labelledby="how-title">
      <h2 id="how-title"></h2>
      <div class="how" id="how"></div>
    </section>
  </main>
  <footer><p id="privacy"></p><p id="license"></p></footer>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
